# Не даёт бесплатному проекту Supabase уйти в автопаузу. Supabase паузит Free
# Plan проекты без активности БД за 7 суток (docs: guides/platform/free-project-pausing).
# Клиентский js/supabase.js тут не помощник: он исполняется только внутри
# открытой сессии браузера в cloud-режиме (js/privacy.store.js) — если
# приложение никто не открывает неделю, дёрнуть Supabase изнутри клиента
# некому. Поэтому пинг — снаружи, тем же способом, что main-watchdog.yml.
#
# Настоящий SELECT к таблице `workouts`, не health-check рута /rest/v1/ —
# запрос доходит до Postgres независимо от того, отфильтрует ли RLS строки
# (RLS может вернуть пусто/403, это не ошибка пинга — активность на проекте
# всё равно засчитана). anon key передаётся в заголовках, не в query —
# публичен по дизайну (.claude/rules/security.md), но не место ему в URL.
#
# Секреты: SUPABASE_URL, SUPABASE_ANON_KEY — добавить в
# Settings → Secrets and variables → Actions. Не заданы — шаг молча
# пропускает пинг, чтобы не спамить провалами на форке/до настройки.
name: Supabase keep-alive

on:
  # Раз в 3 дня — вдвое чаще порога паузы (7 суток), с запасом на то, что
  # GitHub на пике задерживает cron-триггеры.
  schedule:
    - cron: '47 5 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Пинг Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL/SUPABASE_ANON_KEY не заданы в секретах репозитория — пропускаю пинг."
            exit 0
          fi

          # Санитизация через белый список вместо вычёркивания известного
          # мусора: три захода (BOM/CR, затем case-diff по регистру h/https)
          # не поймали невидимый символ перед первой буквой — источник
          # copy-paste (Windows-буфер/браузер) может воткнуть что угодно
          # (zero-width space, NBSP), и перечислять байты по одному дальше
          # нет смысла. Оставляем только символы, валидные в URL/JWT,
          # остальное вырезается разом, чем бы оно ни было.
          SUPABASE_URL=$(printf '%s' "$SUPABASE_URL" | tr -cd 'A-Za-z0-9.:/_-')
          SUPABASE_ANON_KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -cd 'A-Za-z0-9._-')

          # Валидация формата без раскрытия значения секрета в лог — частая
          # причина падений: кавычки/пробел/перенос строки, случайно попавшие
          # в значение при копировании из дашборда или через интерактивный
          # ввод gh secret set.
          echo "SUPABASE_URL: длина ${#SUPABASE_URL} символов"
          case "$SUPABASE_URL" in
            *[\"\']*)
              echo "ОШИБКА: SUPABASE_URL содержит кавычку — пересоздать без кавычек вокруг URL."
              exit 2 ;;
            *[[:space:]]*)
              echo "ОШИБКА: SUPABASE_URL содержит пробел или перенос строки — пересоздать одной строкой без Enter в конце."
              exit 2 ;;
          esac
          # Разбито на префикс/суффикс отдельно (а не одним https://*.supabase.co),
          # чтобы лог сказал, какая именно половина не сходится, не раскрывая
          # само значение.
          case "$SUPABASE_URL" in
            https://*) : ;;
            *) echo "ОШИБКА: SUPABASE_URL не начинается с 'https://' (регистр важен)."; exit 2 ;;
          esac
          case "$SUPABASE_URL" in
            *.supabase.co) : ;;
            *) echo "ОШИБКА: SUPABASE_URL не заканчивается на '.supabase.co' — другой домен/регион или лишний символ на конце."; exit 2 ;;
          esac

          # Роль ключа — из формата или claim `role` в payload JWT; печатается
          # только роль, не ключ. Пинг 25.09 прочитал строку `workouts` при
          # политике `to authenticated using (auth.uid() = user_id)` — так
          # ведёт себя только ключ в обход RLS, а пингу хватает anon.
          case "$SUPABASE_ANON_KEY" in
            sb_publishable_*) key_role=anon ;;
            sb_secret_*) key_role=service_role ;;
            *.*.*)
              payload=$(printf '%s' "$SUPABASE_ANON_KEY" | cut -d. -f2 | tr '_-' '/+')
              while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
              key_role=$(printf '%s' "$payload" | base64 -d 2>/dev/null | grep -o '"role": *"[^"]*"' | sed 's/.*"\([^"]*\)"$/\1/') || true ;;
            *) key_role=unknown ;;
          esac
          echo "SUPABASE_ANON_KEY: роль ${key_role:-unknown}"
          if [ "$key_role" != "anon" ]; then
            echo "ОШИБКА: в SUPABASE_ANON_KEY не anon-ключ — пересоздать секрет из Settings → API Keys (anon / publishable)."
            exit 2
          fi

          # `|| true`: под `bash -e` упавший curl (DNS, таймаут) рвал шаг раньше
          # диагноза ниже, а `-w` и так печатает 000.
          http_code=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/workouts?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY") || true

          # Тело не печатать: репо публичный, лог Actions тоже. Размер отличает
          # пустой ответ RLS (`[]`, 2 байта) от утёкшей строки, не раскрывая её.
          echo "HTTP $http_code, ответ $(wc -c 2>/dev/null < /tmp/resp.json || echo 0) байт"

          # 2xx — обычный ответ. 401/403 — RLS отказал в чтении, но запрос уже
          # дошёл до Postgres, для таймера паузы этого достаточно. Падаем
          # только на сетевой сбой (000) или отказ самого сервера (5xx).
          if [ "$http_code" -ge 500 ] || [ "$http_code" = "000" ]; then
            echo "Supabase не ответил (HTTP $http_code) — проверить, не в паузе ли проект уже."
            exit 1
          fi
