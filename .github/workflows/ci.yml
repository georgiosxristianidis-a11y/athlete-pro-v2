name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # Дрейф базы. Дублирует pre-push намеренно: локальный хук берётся из
  # core.hooksPath, который указывает на корневой чекаут репо — а тот сам может
  # быть протухшим. 2026-07-29: корень стоял на коде 28 июня, то есть гард,
  # закоммиченный днём раньше, не запускался ни у одного worktree. Здесь он
  # выполняется на стороне GitHub, где протухнуть нечему.
  drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (полная история — нужен merge-base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверка дрейфа базы
        run: node scripts/check-branch-drift.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Format check removed: the codebase predates prettier and a whole-repo
      # reformat is a separate decision. Run `npm run format` locally per-file.

      - name: Unit & integration tests
        run: npm test

      - name: Security audit (high+)
        run: npm run security:audit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test --retries=2

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/e2e/report/
          retention-days: 7
