name: CI

# Пины экшенов держатся на мажорах, объявляющих `runs.using: node24`. Node 20 на
# раннерах объявлен устаревшим (2025-09-19): GitHub пока форсирует node24 сам, но
# принудительный запуск однажды сменится отказом, и тогда встанут разом CI и сторож.
# Проверять раннер, а не номер: «поднять на один мажор» здесь неверный рефлекс —
# upload-artifact@v5 всё ещё node20, минимум там v6. Источник правды у каждого
# экшена свой, читается напрямую:
#   gh api repos/actions/<name>/contents/action.yml?ref=<tag> --jq .content | base64 -d | grep using:

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Дрейф базы. Дублирует pre-push намеренно: локальный хук берётся из
  # core.hooksPath, который указывает на корневой чекаут репо — а тот сам может
  # быть протухшим. 2026-07-29: корень стоял на коде 28 июня, то есть гард,
  # закоммиченный днём раньше, не запускался ни у одного worktree. Здесь он
  # выполняется на стороне GitHub, где протухнуть нечему.
  # Гоняется на ЛЮБОМ событии, без `if`. Причина: drift сделан обязательным
  # чеком, а пропущенный (skipped) обязательный чек GitHub засчитывает как
  # успешный — то есть `if` превратил бы защиту в дыру, которая выглядит как
  # зелёная галочка. На push ветки проверка тоже осмысленна: ловит дрейф до
  # открытия PR. На самом main ветка == main, и гард выходит сразу.
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (полная история — нужен merge-base)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # На push событие пусто → checkout берёт ref по умолчанию.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Проверка дрейфа базы
        run: node scripts/check-branch-drift.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Полная история нужна гейту отвергнутых линий (BASE-1): кейсы с
          # настоящим коммитом донорской линии тянут его из локального
          # хранилища, а в мелком клоне объекта нет — тесты уходят в skip
          # МОЛЧА, и «14 passed» перестаёт что-либо значить именно там, где
          # проверка обязана работать.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Префикс ветки называет инструмент (AGENT-8). Шаг внутри обязательного
      # job `test`, а не отдельным job-ом: новый job обязательным чеком не
      # станет, пока его не включат в настройках GitHub, а пропущенный
      # обязательный чек GitHub засчитывает как успешный.
      # `GITHUB_HEAD_REF` здесь единственный источник имени: на PR checkout
      # стоит на merge-коммите, detached, и из git имя ветки не добыть.
      - name: Префикс ветки называет инструмент
        if: github.event_name == 'pull_request'
        run: node scripts/check-branch-prefix.mjs

      # Format check removed: the codebase predates prettier and a whole-repo
      # reformat is a separate decision. Run `npm run format` locally per-file.

      - name: Unit & integration tests
        run: npm test

      # Вердикт выносит scripts/sca-audit.mjs (AGENT-10), а не код возврата
      # `npm audit`: у него ненулевой код значит и находку, и отказ сервиса.
      # 2026-09-19 registry отдавал 503 на bulk-эндпоинт — шаг краснел у всех
      # веток сразу, то есть мёрж был закрыт по всему репозиторию (PR #393).
      # Теперь отказ проверки = ретраи, затем `::warning` в аннотациях при
      # зелёном шаге; находка по-прежнему красит чек. Здесь гоняется БЕЗ
      # --omit-dev: дев-цепочку (stylelint → postcss, кейс nanoid) ловит только
      # этот слой, pre-push смотрит production-зависимости.
      - name: Security audit (high+)
        run: npm run security:audit

  e2e:
    runs-on: ubuntu-latest
    # CI-CACHE: без потолка зависший шаг держит чек до 6 ч (дефолт GitHub).
    # Обычный прогон — 8-22 мин (с установкой браузеров при промахе кеша).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Версия — из установленного пакета, не вписанная руками: прибитый
      # `playwright-1.60.0` пережил бамп до 1.62.1, кеш дал hit со старыми
      # браузерами, установка пропустилась — и все 42 теста упали на
      # «Executable doesn't exist … chromium_headless_shell-1234». Сборки
      # браузеров определяет playwright-core, поэтому ключ — его версия.
      - name: Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('./node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # CI-CACHE (07.10): раньше ключ был хешем всего локфайла, а его
          # меняет каждый бамп версии приложения — каждый релизный PR промахивался
          # и качал браузеры заново (11+ мин, 07.10 загрузка зависала).
          # Suffix names the browsers in the cache. Without it a chromium-only
          # hit skips `playwright install`, and the new webkit project fails
          # with "Executable doesn't exist" — the same mine as the pinned
          # `playwright-1.60.0` key above.
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-chromium-webkit

      # Оба шага ниже зовут `apt-get update`, а он падает целиком, если сбоит
      # ЛЮБОЙ источник образа. 09.09 таким источником стал репозиторий Google
      # Chrome: `dl.google.com/linux/chrome-stable` отдавал `Packages.gz` с
      # несовпадающим хешем, четыре прогона подряд легли с кодом 100. Playwright
      # ставит собственные сборки Chromium и WebKit — этот источник в прогоне
      # не нужен ни одному шагу, и его сбои чек касаться не должны.
      - name: Drop third-party apt sources
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list

      # Таймауты шагов (CI-CACHE): зависшая загрузка падает красным за 15 мин,
      # а не висит часами. Отмена — не выход: `gh pr checks` кладёт её в
      # корзину `cancel`, не `fail`, — красный по таймауту честнее.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx playwright install-deps chromium webkit

      - name: E2E tests
        run: npx playwright test --retries=2

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test/e2e/report/
          retention-days: 7
