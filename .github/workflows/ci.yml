name: CI

# Пины экшенов держатся на мажорах, объявляющих `runs.using: node24`. Node 20 на
# раннерах объявлен устаревшим (2025-09-19): GitHub пока форсирует node24 сам, но
# принудительный запуск однажды сменится отказом, и тогда встанут разом CI и сторож.
# Проверять раннер, а не номер: «поднять на один мажор» здесь неверный рефлекс —
# upload-artifact@v5 всё ещё node20, минимум там v6. Источник правды у каждого
# экшена свой, читается напрямую:
#   gh api repos/actions/<name>/contents/action.yml?ref=<tag> --jq .content | base64 -d | grep using:

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # Дрейф базы. Дублирует pre-push намеренно: локальный хук берётся из
  # core.hooksPath, который указывает на корневой чекаут репо — а тот сам может
  # быть протухшим. 2026-07-29: корень стоял на коде 28 июня, то есть гард,
  # закоммиченный днём раньше, не запускался ни у одного worktree. Здесь он
  # выполняется на стороне GitHub, где протухнуть нечему.
  # Гоняется на ЛЮБОМ событии, без `if`. Причина: drift сделан обязательным
  # чеком, а пропущенный (skipped) обязательный чек GitHub засчитывает как
  # успешный — то есть `if` превратил бы защиту в дыру, которая выглядит как
  # зелёная галочка. На push ветки проверка тоже осмысленна: ловит дрейф до
  # открытия PR. На самом main ветка == main, и гард выходит сразу.
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (полная история — нужен merge-base)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # На push событие пусто → checkout берёт ref по умолчанию.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Проверка дрейфа базы
        run: node scripts/check-branch-drift.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Полная история нужна гейту отвергнутых линий (BASE-1): кейсы с
          # настоящим коммитом донорской линии тянут его из локального
          # хранилища, а в мелком клоне объекта нет — тесты уходят в skip
          # МОЛЧА, и «14 passed» перестаёт что-либо значить именно там, где
          # проверка обязана работать.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Format check removed: the codebase predates prettier and a whole-repo
      # reformat is a separate decision. Run `npm run format` locally per-file.

      - name: Unit & integration tests
        run: npm test

      - name: Security audit (high+)
        run: npm run security:audit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test --retries=2

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test/e2e/report/
          retention-days: 7
