<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP живёт только в helmet (server.js). Мета здесь была второй копией и
         протухла: держала снятые Phase 2 'unsafe-inline'/script-src-attr и не
         знала про blob:. Браузер применяет ПЕРЕСЕЧЕНИЕ политик, поэтому более
         узкая копия молча резала голосовой синтез (media-src, js/intel.view.js).
         vercel.json гонит все маршруты через server.js — заголовок есть везде.
         Сторожит test/csp-single-source.test.js. -->

    <meta name="theme-color" content="#050507" />
    <meta name="description" content="Professional PPL workout tracker" />
    <meta property="og:title" content="Athlete Pro" />
    <meta property="og:description" content="Professional PPL workout tracker" />

    <title>Athlete Pro</title>

    <!-- Тема ДО первой отрисовки: классический синхронный скрипт (module был бы
         отложен, и светлая тема моргала бы тёмным). Инлайна нет намеренно —
         курс на выпил 'unsafe-inline' из CSP. -->
    <script src="js/theme-boot.js"></script>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <!-- .ico первым и с sizes="any": его берут закладки и старые браузеры,
         которые PNG-фавикон игнорируют. Ниже 192-й PNG для всех остальных. -->

    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- Fonts: self-hosted in /fonts (@font-face in css/base.css) — no external requests, airgap-safe -->
    <link rel="preload" as="font" type="font/woff2" href="fonts/manrope-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="fonts/manrope-cyrillic.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="fonts/instrument-sans-latin.woff2" crossorigin />

    <!-- LOAD-2: без бандлера браузер узнаёт о модуле только разобрав того, кто
         его импортирует — отсюда лестница из 12 волн на прогретом кеше
         (docs/handoff/HANDOFF_load_perf.md). Здесь — волны 5 и глубже (модули,
         которые app.js и boot.js достают не напрямую, а через 2+ уровня
         import): browser качает их сразу параллельно, а не слой за слоем.
         Волны 1-4 (entry-скрипты + их прямые импорты) уже видны HTML-сканеру
         без подсказки. Список из замера resource-timing, не «на глазок» —
         менять только вместе с ним. -->
    <link rel="modulepreload" href="js/db/core.js" />
    <link rel="modulepreload" href="js/db/settings.js" />
    <link rel="modulepreload" href="js/db/onerm.js" />
    <link rel="modulepreload" href="js/db/metrics.js" />

    <link rel="modulepreload" href="js/db/planned.js" />
    <link rel="modulepreload" href="js/db/backup.js" />
    <link rel="modulepreload" href="js/db/workouts.js" />
    <link rel="modulepreload" href="js/shared/sparkline.js" />
    <link rel="modulepreload" href="js/claude.store.js" />
    <link rel="modulepreload" href="js/shared/spring.js" />
    <link rel="modulepreload" href="js/flags.js" />

    <!-- ── BLOCK 0: Critical CSS (inline — zero flash) ──────────────── -->
    <style>
      /* RESET */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        height: 100dvh;
        overflow: hidden;
      }
      body {
        height: 100%;
        font-family: 'Manrope', sans-serif;
        font-feature-settings: 'cv11', 'ss01';
        font-variant-numeric: tabular-nums;
        background: #050507;
        color: #ffffff;
        overflow: hidden;
        transition: background 0.25s cubic-bezier(0.4, 0, 0.2, 1), color 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        user-select: none;
      }

      /* DESIGN TOKENS */
      :root {
        --font-main: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-heading: 'Instrument Sans', sans-serif;
        --font-intel: 'Orbitron', sans-serif;
        --side-padding: 20px;
        --c-bg: #050507;
        --c-text-1: #ffffff;
        --c-text-2: #a1a1aa;
        --c-text-3: #7c7c85;
        --c-accent: #00e676;
        --c-accent-bg: rgba(0, 230, 118, 0.12);
        --c-intel: #00d1ff;
        --c-intel-bg: rgba(0, 209, 255, 0.1);
        --c-purple: #a78bfa;
        --c-purple-bg: rgba(167, 139, 250, 0.12);
        --c-secondary: #8b5cf6;
        --c-blue: #60a5fa;
        --c-blue-bg: rgba(96, 165, 250, 0.12);
        --c-red: #ff4d88;
        --c-red-bg: rgba(255, 77, 136, 0.12);
        --c-border: rgba(255, 255, 255, 0.08);
        --nav-h: 72px;
        --sp-1: 8px; --sp-2: 16px; --sp-3: 24px; --sp-4: 32px;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      /* Светлая тема в критическом CSS — только то, что видно до загрузки
         css/base.css (фон, текст, каркас статус-бара). Полная палитра живёт
         в base.css § Section 1.2; дублировать её сюда нельзя — разъедется. */
      :root[data-theme='light'] {
        --c-bg: #f4f4f7;
        --c-text-1: #0b0b0f;
        --c-text-2: #52525b;
        --c-text-3: #71717a;
        --c-accent: #00874a;
        --c-accent-bg: rgba(0, 135, 74, 0.12);
        --c-intel: #0284a3;
        --c-intel-bg: rgba(2, 132, 163, 0.1);
        --c-purple: #6d28d9;
        --c-purple-bg: rgba(109, 40, 217, 0.12);
        --c-secondary: #6d28d9;
        --c-blue: #0284a3;
        --c-blue-bg: rgba(2, 132, 163, 0.12);
        --c-red: #c2185b;
        --c-red-bg: rgba(194, 24, 91, 0.12);
        --c-border: rgba(0, 0, 0, 0.08);
      }
      :root[data-theme='light'] body {
        background: #f4f4f7;
        color: #0b0b0f;
      }
      :root[data-theme='light'] #nav {
        background: rgba(255, 255, 255, 0.97);
        box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.04);
        border-top: 1px solid rgba(0, 0, 0, 0.08);
      }
      /* SHELL */
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* STATUS BAR — Elite Solid */
      #status-bar {
  padding-top: env(safe-area-inset-top, 0px);
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 55px;
        padding: var(--safe-top) var(--sp-2) 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--c-bg); /* Solid background */
        border-bottom: 1px solid var(--c-border);
        z-index: 200;
        transition: all 0.4s ease;
        }

      .status-logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .status-logo-img {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        object-fit: cover;
      }
      .status-logo-text {
        font-size: var(--fs-3);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        display: inline-flex;
        gap: 5px;
        align-items: baseline;
      }
      .logo-w1 { color: var(--c-text-1); font-weight: var(--fw-black); }
      .logo-w2 { color: var(--c-secondary); font-weight: var(--fw-black); letter-spacing: 0.12em; text-shadow: 0 0 12px rgba(139, 92, 246, 0.4); }

      #status-time {
        font-size: var(--fs-1);
        font-weight: var(--fw-bold);
        color: var(--c-text-1);
        font-variant-numeric: tabular-nums;
        opacity: 0.8;
      }

      /* SCREENS */
      #screens {
        flex: 1;
        overflow: hidden;
        position: relative;
      }
      .screen {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 72px var(--sp-2) 120px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(12px);
        transition: opacity 0.4s ease, transform 0.5s var(--spring-bounce);
        will-change: transform, opacity;
        -webkit-overflow-scrolling: touch;
      }
      .screen.active {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      /* BOTTOM NAV */
      #nav {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: calc(var(--nav-h) + var(--safe-bottom));
        padding-bottom: var(--safe-bottom);
        /* 0.85 let bright scroll content (drum numbers) bleed through on
           devices where backdrop-filter is unsupported/disabled — the nav
           read as semi-transparent and stray "30"/"12" ghosts appeared over
           the icons mid-scroll. 0.97 keeps a hint of glass but is opaque
           enough that nothing behind it shows, with or without the blur. */
        background: rgba(10, 10, 15, 0.97);
        backdrop-filter: blur(24px) saturate(150%) brightness(1.1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        -webkit-backdrop-filter: blur(24px) saturate(150%) brightness(1.1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        display: flex;
        align-items: flex-start;
        z-index: 1000;
      }
      .nav-btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        height: var(--nav-h);
        cursor: pointer;
        border: none;
        background: none;
        color: var(--c-text-3);
        transition: all 0.2s ease;
      }
      .nav-btn svg { width: 24px; height: 24px; stroke-width: 1.5; }
      .nav-btn.active { color: var(--c-accent); }
      .nav-btn:active { transform: scale(var(--press-scale)); }

      /* Avatar Btn */
      .athlete-avatar-btn {
        width: 32px; height: 32px; border-radius: 10px;
        background: var(--c-accent-bg); border: 1px solid rgba(0, 230, 118, 0.2);
        color: var(--c-accent); font-size: var(--fs-2); font-weight: var(--fw-black); cursor: pointer;
      }
    </style>

    <!-- Design system & first-screen styles (render-blocking, осознанно) -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/dashboard.css" />

    <!-- Шелл: статус-бар виден с первого кадра, эти два экранными не бывают.
         media="print" + data-lazy → не блокируют рендер, js/boot.js включает их
         обратно в "all". -->
    <link rel="stylesheet" href="css/athlete-room.css" media="print" data-lazy />
    <link rel="stylesheet" href="css/privacy.css" media="print" data-lazy />

    <!-- Остальные 9 таблиц едут лениво, вместе с модулем своего экрана:
         js/shared/lazy-css.js (карта SCREEN_CSS) + точки в js/app.js.
         Правило: новый экран регистрирует свой CSS там же, где Nav.on. -->
  </head>

  <body>
    <div id="app">
      <div id="status-bar">
        <div class="status-logo">
          <img src="icons/icon-64.png" class="status-logo-img" alt="AP" />
          <span class="status-logo-text"><span class="logo-w1">Athlete</span><span class="logo-w2">Pro</span></span>
        </div>
        <div id="status-island-container"></div>
        <div class="status-right" style="display:flex; align-items:center; gap:var(--sp-2)">
        <div id="privacy-indicator" class="privacy-indicator" hidden></div>
        <span id="status-time"></span>
        <button id="athlete-avatar-btn" class="athlete-avatar-btn" data-action="ar:open">
          <span id="athlete-avatar-initials">A</span>
        </button>
      </div>
      </div>

      <div id="screens">
        <div id="s-home" class="screen active"></div>
        <div id="s-train" class="screen"></div>
        <div id="s-intel" class="screen intel-screen"></div>
        <div id="s-stats" class="screen"></div>
        <div id="s-journal" class="screen"></div>
        <div id="s-body" class="screen"><div id="body-stats-root"></div></div>
        <div id="s-profile" class="screen"></div>
        <div id="s-island-settings" class="screen"></div>
      </div>

      <nav id="nav">
        <button class="nav-btn active" data-s="s-home" data-action="nav:go" aria-label="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" /></svg>
        </button>
        <button class="nav-btn" data-s="s-train" data-action="nav:go" data-force="1" aria-label="Train">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><line x1="6.5" y1="12" x2="17.5" y2="12" /><rect x="3" y="9" width="3" height="6" rx="1" /><rect x="18" y="9" width="3" height="6" rx="1" /><line x1="2" y1="11" x2="2" y2="13" /><line x1="22" y1="11" x2="22" y2="13" /></svg>
        </button>
        <button class="nav-btn" data-s="s-stats" data-action="nav:go" aria-label="Stats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></svg>
        </button>
        <button class="nav-btn" data-s="s-profile" data-action="nav:go" aria-label="Profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </nav>
      <div id="athlete-room" class="athlete-room-overlay"></div>
    </div>

    <div id="toast-wrap" role="status" aria-live="polite"></div>
    <script type="module" src="js/boot.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
